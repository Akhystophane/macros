macro_info:
  description: Text animation for displaying long passages or sentence transcripts. Useful
    as captions, especially when the text is too long for other text animations.
  type_description: Text animation for displaying long passages or sentence transcripts.
    Useful as captions, especially when the text is too long for other text animations.
  pos_possibility: &id001
  - top_main
  - main
  - bottom_main
  style_family: minimalist
  colors:
  - Ink
pos_possibility: *id001
variables:
- name: Text1
custom_tools:
- name: CustomTool1
  attrs:
    NumberIn1:
      keyframes:
      - frame: 0
        value: 0.0
      - frame: 13
        value: 13.0
      anchor_variable: Text1
